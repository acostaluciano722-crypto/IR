name: ir_mobile
description: Aplicacion movil IR para pasajeros.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  google_maps_flutter: ^2.14.0
  pointer_interceptor: ^0.10.1+3
  geolocator: ^14.0.2
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2

dev_dependencies:
  google_maps_flutter_platform_interface: ^2.17.0
  geolocator_platform_interface: ^4.4.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/branding/ir_logo.png
    - assets/icons/car_marker.svg
    - assets/icons/moto_marker.svg
