name: ir

x-app: &app
  image: ir-backend:local
  init: true
  restart: unless-stopped
  networks:
    - ecosystem
  environment: &app-environment
    DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,0.0.0.0,10.0.2.2}
    CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-true}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5353,http://127.0.0.1:5353}
    DB_ENGINE: postgresql
    DB_HOST: ${DB_HOST:-ir_postgres_postgis}
    DB_PORT: ${DB_PORT:-5432}
    DB_NAME: ${DB_NAME:-ir_promaster_db}
    DB_USER: ${DB_USER:-casaco}
    DB_PASSWORD: ${DB_PASSWORD:-}
    GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    REDIS_CACHE_URL: redis://redis:6379/1
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/2

services:
  backend:
    <<: *app
    build:
      context: ./backend
    ports:
      - '${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8000}:8000'
    volumes:
      - ./backend/media:/app/media
    environment:
      <<: *app-environment
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      start_period: 60s
      retries: 5

  worker:
    <<: *app
    command: [celery, -A, config, worker, --loglevel=INFO, '--concurrency=${CELERY_WORKER_CONCURRENCY:-2}', '--hostname=celery@%h']
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 5m
    healthcheck:
      test: [CMD-SHELL, 'celery -A config inspect ping --destination "celery@$$HOSTNAME" --timeout 5 | grep -q pong']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory-policy, noeviction]
    restart: unless-stopped
    networks:
      - ecosystem
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  ecosystem:
    external: true
    name: ${IR_DOCKER_NETWORK:-ir_network}

volumes:
  redis_data:
